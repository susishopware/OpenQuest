# Whole OpenQuest stack for local development, see docs/docker.md.
#   docker compose up -d --build      # everything
#   docker compose up -d db minio     # only the backing services (for `dotnet run` / `pnpm dev` on the host)
# Secrets come from an optional .env next to this file (copy .env.example, never commit .env).

x-http-check: &http-check
  interval: 10s
  timeout: 5s
  retries: 10

services:
  db:
    image: ${DB_IMAGE:-postgis/postgis:17-3.5}
    # postgis/postgis is published for amd64 only; Apple Silicon runs it through emulation (Rosetta).
    # For a native arm64 build set DB_IMAGE=imresamu/postgis:17-3.5 and DB_PLATFORM=linux/arm64 in .env.
    platform: ${DB_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_USER: openquest
      POSTGRES_PASSWORD: openquest
      POSTGRES_DB: openquest
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openquest -d openquest"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The official minio/minio image is no longer published on Docker Hub; the frozen Bitnami legacy
  # image is fine for local development. Any S3-compatible server works (see Storage__* settings).
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: openquest
      MINIO_ROOT_PASSWORD: openquest-secret
      MINIO_DEFAULT_BUCKETS: openquest-photos
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # The image has no curl; bash speaks HTTP through /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      <<: *http-check

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: openquest-api
    env_file:
      - path: .env
        required: false
    environment:
      # Development: JWT key generated per start, admin password generated on first start and printed
      # once in the log (`docker compose logs api | grep "generated password"`) unless Admin__Password is set.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Container addresses win over the localhost values that .env holds for `dotnet run`.
      ConnectionStrings__Default: Host=db;Port=5432;Database=openquest;Username=openquest;Password=openquest
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: openquest
      Storage__SecretKey: openquest-secret
      Storage__Bucket: openquest-photos
      Cors__Origins: http://localhost:3000,http://localhost:5173,http://localhost:8787
    ports:
      - "${API_PORT:-5076}:5076"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: openquest-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    # The prototype still uses mock data; add `depends_on: api` once it calls the API.
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: openquest-dashboard
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8787
    ports:
      - "${DASHBOARD_PORT:-8787}:8787"
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
